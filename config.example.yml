# Copy this file to `config.yml` and edit as needed. Every value below is
# optional: anything omitted falls back to the built-in defaults shown here,
# so an empty or missing config.yml reproduces the original behavior.

logging:
  # One of: DEBUG, INFO, WARNING, ERROR, CRITICAL.
  level: INFO
  # Rotating log file size and number of backups kept.
  max_bytes: 10485760   # 10 MiB
  backup_count: 5
  # Optional log file path (relative paths resolve against the project root).
  # Usually set via LOG_FILE in .env instead.
  # file: process-sde.log

sde:
  # CCP SDE endpoints. {build_number} is substituted into archive_url.
  latest_url: https://developers.eveonline.com/static-data/tranquility/latest.jsonl
  archive_url: https://developers.eveonline.com/static-data/tranquility/eve-online-static-data-{build_number}-jsonl.zip

map:
  # Decimal places to round projected map positions to.
  position_round: 2
  # Output size (pixels) of the neighbour mini-map.
  neighbor_map_size: 128
  # World-unit scale factors per map family. "au" (1 astronomical unit in km)
  # is the base scale for New Eden and Anoikis.
  scale_factors:
    au: 1.496e11
    abyssal_deadspace: 5.236e11
    tutorials: 3.74e11

type_data:
  # Group IDs which correspond to dockable Upwell structures. Includes
  # citadels, engineering complexes, and refineries.
  dockable_upwell_groups: [1657, 1404, 1406]
  # Group IDs whose loss mails are coloured as NPC kills.
  npc_groups: [1764, 1765, 1766, 1767, 1803, 1813, 1814, 1876, 1924, 1878, 1879, 1880, 1896, 1909, 4917]
  # Fallback bracket icon ID used when a type has no specific bracket.
  default_icon: 4533

processing:
  # Solar system IDs to skip entirely (e.g. unreachable/internal systems).
  skip_system_ids: [19000001, 26000001, 36000001]

output:
  # Write a sibling <file>.br (Brotli) next to each generated JSON file, kept in
  # lockstep with it, for nginx `brotli_static on;` to serve.
  precompress: true
  # Brotli quality 0-11 (11 = smallest/slowest; fine for a periodic batch job).
  brotli_quality: 11
  # Skip precompressing files smaller than this (bytes); avoids many tiny .br files.
  precompress_min_bytes: 1024
